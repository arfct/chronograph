[versions]
# See docs/specs/2026-08-03-android-port-design.md for why these are pinned here.
agp = "9.2.0"
kotlin = "2.4.0"
composeBom = "2026.06.00"
# Glance stable (1.1.1, Oct 2024) predates providePreview(); 1.3.0-alpha02 adds
# only Wear-widget APIs. 1.2.0-rc01 is the freshest version useful to this app.
glance = "1.2.0-rc01"
activityCompose = "1.9.3"
junit = "5.11.0"

[libraries]
androidx-glance = { module = "androidx.glance:glance", version.ref = "glance" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android: AGP 9 ships built-in Kotlin.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
